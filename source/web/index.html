<!-- The game draws its own chrome, so the page is a full-bleed canvas: device-width, no zoom, and
     (for iOS) under the safe areas, which the wrapper keeps its square clear of. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Text Crush">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

<script src="../game/classes/model/Util.js"></script>
<script src="../game/classes/model/Symbol.js"></script>
<script src="../game/classes/model/Neighbor.js"></script>
<script src="../game/classes/model/Position.js"></script>
<script src="../game/classes/model/Board.js"></script>
<script src="../game/classes/model/Game.js"></script>
<script src="../game/classes/model/Sprite.js"></script>
<script src="../game/classes/view/Tile.js"></script>
<script src="../game/classes/view/Display.js"></script>
<script>

    document.addEventListener("DOMContentLoaded", function () {

        let AudioContext = window.AudioContext // Default
            || window.webkitAudioContext // Safari and old versions of Chrome
            || false;
        let context = new AudioContext();

        // A tap should be felt as well as seen. The Android and iOS wrappers expose one of these; a
        // plain browser has neither, and navigator.vibrate is unavailable in the Android web view
        // without the VIBRATE permission, so the wrappers are what can actually do it.
        function haptic() {
            if (window.TextCrush && window.TextCrush.tick) {
                window.TextCrush.tick();
            } else if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
                window.flutter_inappwebview.callHandler("haptic");
            }
        }

        let c = document.createElement("canvas");

        // A canvas is a bitmap, so give it one backing pixel per device pixel and display it at the
        // css size. Without this a 1080-wide phone at 2.75x drew into a 393 px canvas and stretched
        // it to the screen - soft letters, and small text rasterised at 11 px then blown up.
        //
        // The game is square (board plus its score line) and lays itself out from the smaller
        // viewport dimension, so the canvas is that square, centred: the board fills it exactly, and
        // a tall phone screen does not leave the board pinned to the top with a void underneath.
        let dpr = window.devicePixelRatio || 1;
        let side = Math.min(window.innerWidth, window.innerHeight);

        c.setAttribute("width", Math.round(side * dpr).toString());
        c.setAttribute("height", Math.round(side * dpr).toString());
        c.style.width = side + "px";
        c.style.height = side + "px";

        // Positioned by hand rather than with flex centring: inside the Android web view a
        // `height: 100vh` flex body put the canvas at y = -196 instead of y = 0, so the board fell
        // off the top of the screen. Integer offsets also avoid a half-pixel transform, which would
        // resample the canvas and undo the point of drawing it at device density.
        c.style.display = "block";
        c.style.position = "absolute";
        c.style.left = Math.round((window.innerWidth - side) / 2) + "px";
        c.style.top = Math.round((window.innerHeight - side) / 2) + "px";

        document.body.style.margin = "0";
        document.body.style.background = "#221100";
        document.body.appendChild(c);

        // The wrappers draw the score line natively (hud=off) and hand the board the whole square; a
        // browser gets the game's own score line. The motion preference is the system's, not ours.
        let nativeHud = /(^|[?&])hud=off(&|$)/.test(location.search);
        let reduceMotion = !!(window.matchMedia
            && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

        let muted = localStorage.getItem("muted") === "1";

        // The board is a canvas, so none of it exists for a screen reader or a keyboard. This is that
        // same information as real DOM: 64 focusable cells carrying their letter and position, and a
        // live region for the score. It is clipped to nothing visually; focusing a cell rings it on
        // the canvas instead (Display.focusCell), so a sighted keyboard user is not flying blind.
        let mirror = document.createElement("div");
        let status = document.createElement("div");

        (function () {
            let style = document.createElement("style");
            style.textContent =
                "#board-mirror,#board-status,#help-text,#help-button{position:absolute;width:1px;height:1px;"
                + "overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}"
                + "#board-mirror button,#help-button{width:1px;height:1px}";
            document.head.appendChild(style);
        }());

        function buildMirror() {

            mirror.id = "board-mirror";
            mirror.setAttribute("role", "grid");
            mirror.setAttribute("aria-label", "Text Crush board");

            status.id = "board-status";
            status.setAttribute("role", "status");
            status.setAttribute("aria-live", "polite");

            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {

                    let cell = document.createElement("button");
                    cell.type = "button";
                    cell.setAttribute("role", "gridcell");

                    cell.addEventListener("focus", function () {
                        if (d) {
                            d.focusCell(new Neighbor(x, y));
                        }
                    });

                    cell.addEventListener("blur", function () {
                        if (d) {
                            d.focusCell(null);
                        }
                    });

                    cell.addEventListener("click", function () {
                        if (playCell && d && g && !d.busy) {
                            playCell(x, y);
                        }
                    });

                    mirror.appendChild(cell);
                }
            }

            document.body.appendChild(mirror);
            document.body.appendChild(status);
        }

        function updateMirror() {

            if (!d || !g) {
                return;
            }

            let cells = mirror.children;

            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {

                    let symbol = g.board.getPosition(x, y);
                    let node = cells[(y * 8) + x];
                    let place = "row " + (y + 1) + " column " + (x + 1);

                    node.textContent = symbol.value === -1 ? "" : symbol.character;
                    node.setAttribute("aria-label", symbol.value === -1
                        ? "empty, " + place
                        : symbol.character + ", " + place);
                }
            }

            status.textContent = "Score " + g.score + ", "
                + (g.movesAvailable - g.movesUsed) + " turns left";
        }

        buildMirror();

        // The rules as real text, and a way to ask for them, for a screen reader or a keyboard. The
        // game itself has no words on screen until the rules are opened, so this is also the only
        // place a screen reader can read them.
        let helpText = document.createElement("p");
        helpText.id = "help-text";
        helpText.textContent = "Tap a letter to clear it and the matching letters joined to it. "
            + "A run of 2 scores 2, of 4 scores 8, of 8 scores 128. You have 20 turns and each clear "
            + "spends one. Your best is kept on this device.";

        let helpButton = document.createElement("button");
        helpButton.id = "help-button";
        helpButton.type = "button";
        helpButton.textContent = "How to play";
        helpButton.addEventListener("click", function () {
            window.setTextCrushHelp(true);
        });

        document.body.appendChild(helpText);
        document.body.appendChild(helpButton);

        let HELP_KEY = "seen-help";

        function helpSeen() {
            return localStorage.getItem(HELP_KEY) !== null;
        }

        // The wrapper's "?" button calls this, and so does the game's own "?" beside the sound toggle.
        window.setTextCrushHelp = function (show) {

            localStorage.setItem(HELP_KEY, "1");

            if (!d) {
                return;
            }

            if (show) {
                d.showHelp();
            } else {
                d.hideHelp();
            }
        };

        // The in-progress game is kept here, so a restart resumes the board instead of dealing a new
        // one. The high score has its own key and is never touched by this.
        let SAVE_KEY = "game-state";

        /** the board only changes when a move settles, so that is when it is worth writing */
        function saveState() {

            if (!g) {
                return;
            }

            if (g.movesUsed >= g.movesAvailable) {
                localStorage.removeItem(SAVE_KEY);
                return;
            }

            localStorage.setItem(SAVE_KEY, g.serialize());
        }

        // The wrapper's header draws score, turns and best itself, so the game hands it the state
        // rather than making it read the canvas.
        function report() {
            if (!g) {
                return;
            }

            let state = {
                score: g.score,
                turns: g.movesAvailable - g.movesUsed,
                total: g.movesAvailable,
                best: parseInt(localStorage.getItem("high_score") || "0", 10) || 0,
                muted: muted
            };

            if (window.TextCrush && window.TextCrush.state) {
                window.TextCrush.state(JSON.stringify(state));
            } else if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
                window.flutter_inappwebview.callHandler("state", state);
            }
        }

        // The wrapper's sound button calls this; the web build's own note glyph calls it too.
        window.setTextCrushMuted = function (value) {

            muted = !!value;
            localStorage.setItem("muted", muted ? "1" : "0");

            if (d) {
                d.muted = muted;
                d.draw();
            }

            report();

            return muted;
        };

        let g = null;
        let d = null;

        // Set once a game exists: the mirror's cells and anything else outside initialize() clear a
        // run through this, so there is exactly one tap pipeline.
        let playCell = null;

        function initialize() {

            c.removeEventListener('click', initialize);

            let previous = d;

            // Resume the game that was in progress, if there is one. Anything unreadable - an older
            // version's state, or a mangled value - is dropped and a fresh board dealt.
            let saved = null;

            try {
                let stored = localStorage.getItem(SAVE_KEY);
                saved = (stored === null) ? null : Game.restore(stored);
            } catch (unreadable) {
                saved = null;
            }

            if (saved === null) {
                localStorage.removeItem(SAVE_KEY);
            }

            g = (saved === null) ? new Game(8, 8) : saved;
            d = new Display(c, g, !nativeHud);

            if (previous !== null) {
                previous.stop();
            }

            d.reduceMotion = reduceMotion;
            d.muted = muted;

            // The one tap pipeline, reachable from the mirror as well as from the board.
            playCell = function (x, y) {
                let before = g.score;
                afterRemoval(d.onClickCell(x, y), before);
            };

            updateMirror();
            report();

            function gameOver() {
                let high_score_key = "high_score";

                // The game is over: there is nothing to resume, and the next tap deals a new board.
                localStorage.removeItem(SAVE_KEY);

                c.removeEventListener('click', onClick);
                c.removeEventListener('pointerdown', pressHandler);
                c.removeEventListener('pointerup', releaseHandler);
                c.removeEventListener('pointercancel', releaseHandler);
                c.removeEventListener('pointerleave', releaseHandler);
                d.releasePress();
                let message = "Game Over";

                let high_score = localStorage.getItem(high_score_key);

                if (g.score > high_score) {
                    localStorage.setItem(high_score_key, g.score);
                    message += "\nNew High Score!!!\n" +
                        Display.addCommas(g.score.toString());
                } else {
                    message += "\nPrevious High Score:\n" +
                        Display.addCommas(high_score);
                }


                d.showGameOver(message);
                d.burst();

                if (g) {
                    report();
                }

                g = null;

                // the display stays until the card has left, so the exit can be animated
                c.addEventListener('click', restart);
            }

            /** the card leaves first, then the next game is dealt */
            function restart() {

                c.removeEventListener('click', restart);

                let leaving = d;

                if (leaving === null) {
                    initialize();
                    return;
                }

                leaving.playCardExit(function () {
                    d = null;
                    initialize();
                });
            }

            function play(context, frequency, duration) {

                let o = context.createOscillator();
                let g = context.createGain();

                o.connect(g);
                g.connect(context.destination);

                g.gain.exponentialRampToValueAtTime(
                    0.00001, context.currentTime + duration
                );

                o.frequency.value = frequency;
                o.start();

            }

            function pressHandler(e) {
                if (d.busy) {
                    return;
                }

                let bounds = c.getBoundingClientRect();
                d.press(e.x - bounds.left, e.y - bounds.top);
            }

            function releaseHandler() {
                d.releasePress();
            }

            // Everything that follows a cleared run, whether the tap came from the board, the
            // keyboard, a screen reader or a wrapper's own control.
            function afterRemoval(values, scoreBefore) {

                let neighbors = values["neighbors"];
                let count = Object.keys(neighbors).length;

                if (count === 0) {
                    return;
                }

                haptic();

                // What the run was worth, rising from where it stood.
                d.scoreFloat(neighbors, g.score - scoreBefore);

                if (AudioContext && !muted) {

                    let noteLength = (500 / 8) / 1000;

                    let notes = [];

                    for (let i = 0; i < count; i++) {
                        notes.push(440 + (60 * i));
                    }

                    for (let i = 0; i < notes.length; i++) {
                        setTimeout(function () {
                            play(context, notes[i], noteLength);
                        }, noteLength * i * 1000);
                    }


                }

                // The run shrinks where it stood, the board falls, and then takes the impact.
                d.animatePop(function () {

                    let plan = g.fallPlan();

                    g.moveDown();

                    d.animateFall(plan, function () {

                        d.animateSettle(function () {

                            updateMirror();
                            saveState();
                            report();
                            d.pulseTurns();

                            if (g.movesUsed >= g.movesAvailable) {
                                gameOver();
                            }

                        });

                    });

                });
            }

            function onClick(e) {

                if (d.busy) {
                    return;
                }

                // The canvas sits in the middle of the page, so a click's viewport coordinates have
                // to be moved into the canvas before the game can map them to a cell.
                let bounds = c.getBoundingClientRect();
                let x = e.x - bounds.left;
                let y = e.y - bounds.top;

                if (d.hitHelp(x, y)) {
                    window.setTextCrushHelp(true);
                    return;
                }

                if (d.hitMute(x, y)) {
                    window.setTextCrushMuted(!muted);
                    return;
                }

                let scoreBefore = g.score;

                afterRemoval(d.onClick(x, y), scoreBefore);
            }

            d.animateReveal(function () {
                c.addEventListener('click', onClick);
                c.addEventListener('pointerdown', pressHandler);
                c.addEventListener('pointerup', releaseHandler);
                c.addEventListener('pointercancel', releaseHandler);
                c.addEventListener('pointerleave', releaseHandler);

                // Nothing on screen says what to do, so the rules are shown once - on a fresh install
                // only, and never over a resumed game.
                if (!helpSeen()) {
                    window.setTextCrushHelp(true);
                }
            });
        }

        initialize();

        (function () {
            window.addEventListener("resize", resizeThrottler, false);
            let resizeTimeout = null;

            function resizeThrottler() {
                if (!resizeTimeout) {
                    resizeTimeout = setTimeout(function () {
                        resizeTimeout = null;
                        if (d !== null) {
                            d.draw();
                        }
                    }, 66);
                }
            }
        }());
        // Offline shell: after the first visit the game runs from the cache, which is what makes it
        // installable (Add to Home Screen) and playable on a plane. The worker lives one directory up
        // because its scope has to cover the engine in ../game/ as well as this page.
        //
        // Not in a wrapper: the assets are already local there, the worker is not bundled, and asking
        // for it only produces a failed fetch in the console.
        if ("serviceWorker" in navigator && "file:" !== location.protocol && !nativeHud) {
            navigator.serviceWorker.register("../sw.js");
        }
    })
    ;


</script>
